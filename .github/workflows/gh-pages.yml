# The docs in docs/ are published as a subproject of workfloworchestrator.github.io, which builds
# them from this repository. Nothing here publishes them, so a merge to main has to tell that repo
# to rebuild; otherwise the published documentation silently keeps serving the previous version.
name: Dispatch to workfloworchestrator.github.io
on:
  push:
    branches:
      - main

jobs:
  trigger-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: workfloworchestrator
          repositories: workfloworchestrator.github.io

      - name: Trigger docs build on workfloworchestrator.github.io
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/workfloworchestrator/workfloworchestrator.github.io/dispatches \
            -f event_type=docs-update

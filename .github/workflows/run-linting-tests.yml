# Runs the pre-commit suite. Most hooks build their own isolated environment, so this
# does not need a python version matrix. The exceptions are uv-lock and docs-snippets,
# which run uv directly; docs-snippets syncs the project (including the extras, because
# the snippets in docs/ import fastapi) in order to execute them.

name: Linting tests

on:
  push:
  workflow_call:

jobs:
  linting:
    name: Linting Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.13"
          python-version: '3.13'
          enable-cache: true
      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

# Runs the pre-commit suite. Most hooks build their own isolated environment, so this
# does not need a python version matrix. The exceptions are uv-lock and docs-snippets,
# which run uv directly; docs-snippets syncs the project (including the extras, because
# the snippets in docs/ import fastapi) in order to execute them.

name: Linting tests

on:
  push:
  workflow_call:

jobs:
  linting:
    name: Linting Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          python-version: '3.13'
          enable-cache: true
      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

# Runs the pre-commit hooks (via prek). Most hooks build their own isolated environment, so this
# does not need a python version matrix. The exceptions are uv-lock and docs-snippets,
# which run uv directly; docs-snippets syncs the project (including the extras, because
# the snippets in docs/ import fastapi) in order to execute them.

name: Linting tests

on:
  push:
  workflow_call:

jobs:
  linting:
    name: Linting Tests
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: '3.13'
          enable-cache: true
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Check with mypy
        run: uv run --no-sync mypy pydantic_forms
      - name: Run prek hooks
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        env:
          SKIP: mypy

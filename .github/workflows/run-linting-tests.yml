# Runs the pre-commit suite. pre-commit builds its own isolated environments per
# hook, so this does not need a python version matrix; uv is only required for
# the uv-lock hook.

name: Linting tests

on:
  push:
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  linting:
    name: Linting Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"
          python-version: '3.13'
          enable-cache: true
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

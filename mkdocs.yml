# workfloworchestrator.github.io uses site_name in the URL, don't change it
site_name: Pydantic Forms
site_description: JSON schema form generation for FastAPI/Flask, powered by Pydantic v2.
repo_url: "https://github.com/workfloworchestrator/pydantic-forms"
repo_name: "workfloworchestrator/pydantic-forms"
nav:
  - index.md
  - installation.md
  - usage.md
  - examples.md
  - errors.md
  - how-it-works.md
  - Architecture Decisions:
      - Records: decisions/index.md
      - Open Design Questions: decisions/open-questions.md
        - Required Fields: required-fields.md

theme:
  name: material
  palette:
    - scheme: default
      primary: cyan
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: cyan
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight
    - navigation.sections
plugins:
  - search
  - include-markdown
  # Deliberately unconfigured: the options live per-block in docs/reference.md, so that they also
  # hold when this page is built as a subproject of workfloworchestrator.github.io, which uses the
  # parent's mkdocs.yml and would otherwise apply the parent's options here. See that page.
  - mkdocstrings
markdown_extensions:
  - admonition  # classic:  !!! note "Title"
  # blocks:   /// note | Title
  # https://facelessuser.github.io/pymdown-extensions/extensions/blocks/plugins/admonition/#options
  - pymdownx.blocks.admonition
  # collapsible blocks: /// details | Title  (with "    type: note" as first line of content)
  # https://facelessuser.github.io/pymdown-extensions/extensions/blocks/plugins/details/
  - pymdownx.blocks.details
copyright: "&copy; 2019 - 2026 SURF"
